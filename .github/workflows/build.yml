name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Giải nén project
        run: unzip -o AdBlockBrowser-android.zip -d .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build debug APK
        id: build
        continue-on-error: true
        working-directory: AdBlockBrowser
        run: |
          gradle assembleDebug --stacktrace 2>&1 | tee ../build.log
          exit ${PIPESTATUS[0]}

      # Log build không đọc được qua trình duyệt log của GitHub (link log bị chặn tải tự động
      # từ môi trường sandbox) -- lưu thẳng log vào repo (build-logs/last-build.log) để dễ đọc
      # qua raw.githubusercontent.com. Dùng "[skip ci]" để commit này không tự kích hoạt build lại.
      - name: Save build log to repo
        if: always()
        continue-on-error: true
        run: |
          git config user.name "gh-actions-bot"
          git config user.email "actions@github.com"
          mkdir -p build-logs
          cp build.log build-logs/last-build.log
          git add build-logs/last-build.log
          git commit -m "chore: cập nhật build log [skip ci]" || echo "Không có gì thay đổi để commit"
          git pull --rebase --autostash origin main || true
          git push || echo "Push log thất bại (có thể do phiên khác đang push cùng lúc) - bỏ qua, không ảnh hưởng APK"

      - name: Dừng job nếu build thật sự thất bại
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: AdBlockBrowser/app/build/outputs/apk/debug/*.apk
