name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Giải nén project
        run: unzip -o AdBlockBrowser-android.zip -d .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build debug APK
        id: build
        continue-on-error: true
        working-directory: AdBlockBrowser
        run: |
          gradle assembleDebug --stacktrace 2>&1 | tee ../build.log
          exit ${PIPESTATUS[0]}

      # Log build không đọc được qua trình duyệt log của GitHub (link log bị chặn tải tự động
      # từ môi trường sandbox) -- lưu thẳng log vào repo (build-logs/last-build.log) qua GitHub
      # Contents API (PUT 1 file, atomic) thay vì "git push" -- tránh hẳn xung đột khi có phiên
      # khác đang push cùng lúc vào repo (từng làm "git push" âm thầm thất bại).
      - name: Save build log to repo (via API)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base64 -w0 build.log > /tmp/b64.txt
          curl -s -H "Authorization: token $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/contents/build-logs/last-build.log?ref=main" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('sha','') if isinstance(d, dict) else '')" > /tmp/sha.txt
          python3 -c "import json; sha=open('/tmp/sha.txt').read().strip(); c=open('/tmp/b64.txt').read().strip(); d={'message':'chore: cap nhat build log [skip ci]','content':c,'branch':'main'}; d.update({'sha':sha} if sha else {}); print(json.dumps(d))" > /tmp/body.json
          curl -s -X PUT -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/contents/build-logs/last-build.log" -d @/tmp/body.json -w "\nHTTP_STATUS:%{http_code}\n"

      - name: Dừng job nếu build thật sự thất bại
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: AdBlockBrowser/app/build/outputs/apk/debug/*.apk
